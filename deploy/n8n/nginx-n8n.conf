# n8n en https://jramosabogados.com/n8n/ — se pega en /etc/nginx/sites-available/gretty.
# Probado con n8n 2.42.6: editor, assets, /rest, websocket (/rest/push) y /healthz.

# ── 1. ARRIBA del archivo, FUERA de cualquier server { } ─────────────────────
map $http_upgrade $n8n_connection_upgrade {
    default upgrade;
    ''      close;
}

# ── 2. DENTRO del server { } que tiene "listen 443 ssl" (el que dejó Certbot) ─
location = /n8n { return 301 /n8n/; }

location /n8n/ {
    # Con "/" al final: Nginx quita el /n8n/ antes de pasarle la petición a n8n.
    # Sin ella n8n recibe /n8n/assets/... y responde el HTML del editor.
    proxy_pass http://127.0.0.1:5678/;

    # El editor usa websocket (/n8n/rest/push) para ver las ejecuciones en vivo.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $n8n_connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_read_timeout 3600s;

    # Opcional: editor solo desde la oficina (n8n ya pide usuario y contraseña).
    # allow <IP pública de la oficina>;
    # deny all;
}
